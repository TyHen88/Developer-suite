<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bayonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Pure Geometric Monogram "B" (No triangle/spire, clean tech chamfers) -->
  <g transform="translate(15, 12)">
    <!-- Outer Cyan B Frame -->
    <path 
      d="M8 6 H50 L72 28 L50 48 L72 68 L50 90 H8 Z" 
      fill="none" 
      stroke="url(#bayonCyanGrad)" 
      stroke-width="7" 
      stroke-linejoin="miter" 
      stroke-miterlimit="4"
    />

    <!-- Middle Horizontal Divider -->
    <line x1="8" y1="48" x2="50" y2="48" stroke="url(#bayonCyanGrad)" stroke-width="7" />

    <!-- Top Loop Cutout -->
    <polygon points="20,18 44,18 56,28 44,38 20,38" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="miter" />

    <!-- Bottom Loop Cutout -->
    <polygon points="20,58 44,58 56,68 44,78 20,78" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="miter" />
  </g>

  <!-- Typography -->
  <text x="120" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="-0.5">
    BAYON <tspan fill="#22d3ee">DEVELOPER</tspan>
  </text>
  <text x="122" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="3">
    MODERN UI &amp; INFRASTRUCTURE
  </text>
</svg>
