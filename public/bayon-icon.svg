<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iconCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background App Container -->
  <rect width="100" height="100" rx="22" fill="#080b12" />
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Pure Geometric Monogram B Mark (No A/triangle shape) -->
  <g transform="translate(18, 14)">
    <!-- Outer B Frame -->
    <path 
      d="M6 6 H38 L54 22 L38 36 L54 50 L38 66 H6 Z" 
      fill="none" 
      stroke="url(#iconCyanGrad)" 
      stroke-width="5.5" 
      stroke-linejoin="miter" 
      stroke-miterlimit="4"
    />

    <!-- Middle Divider -->
    <line x1="6" y1="36" x2="38" y2="36" stroke="url(#iconCyanGrad)" stroke-width="5.5" />

    <!-- Top Loop Inset -->
    <polygon points="14,14 34,14 42,22 34,28 14,28" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="miter" />

    <!-- Bottom Loop Inset -->
    <polygon points="14,44 34,44 42,50 34,58 14,58" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="miter" />
  </g>
</svg>
